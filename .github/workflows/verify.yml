name: Verify Wintermute Alpha solutions

on:
  push:
    branches: [main, complete-challenges]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: Analysis checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run official hash checker
        run: python alpha.py check 01 04 05 08

  code:
    name: Fork test ${{ matrix.challenge }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        challenge: ["00", "02", "03", "06", "07"]
    env:
      USER_ADDRESS: "0x1000000000000000000000000000000000000001"
      XLAYER_RPC_URL: "https://rpc.xlayer.tech"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install forge-std
        run: forge install foundry-rs/forge-std
      - name: Run historical fork check with provider fallback
        shell: bash
        run: |
          set -uo pipefail
          challenge="${{ matrix.challenge }}"

          # Firepit only forks X Layer. alpha.py still requires ETH_RPC_URL to
          # be non-empty, but the Ethereum endpoint is not contacted.
          if [[ "$challenge" == "07" ]]; then
            export ETH_RPC_URL="https://gateway.tenderly.co/public/mainnet"
            if timeout 900 python3 alpha.py check "$challenge"; then
              exit 0
            else
              exit $?
            fi
          fi

          # Cold Start forks both Ethereum and Robinhood Chain. Robinhood's
          # wallet RPC is not guaranteed to retain historical state, so test
          # independent archive-capable providers and throttle Foundry for the
          # low-rate public endpoints.
          if [[ "$challenge" == "06" ]]; then
            export ETH_RPC_URL="https://gateway.tenderly.co/public/mainnet"
            robinhood_endpoints=(
              "https://rpc.nodeflare.app/robinhood/public"
              "https://robinhood-rpc.publicnode.com"
              "https://robinhood-mainnet.g.alchemy.com/v2/docs-demo"
              "https://rpc.mainnet.chain.robinhood.com"
            )

            for l2url in "${robinhood_endpoints[@]}"; do
              echo "::group::Challenge 06 via $l2url"
              export ROBINHOOD_RPC_URL="$l2url"
              if timeout 720 forge test \
                --rpc-url "$ETH_RPC_URL" \
                --match-path challenges/06-cold-start/Solution.t.sol \
                --match-test test_Solution \
                --fork-retries 8 \
                --fork-retry-backoff 1000 \
                --compute-units-per-second 2 \
                -vv; then
                echo "::endgroup::"
                echo "Challenge 06 passed via $l2url"
                exit 0
              else
                status=$?
                echo "::endgroup::"
                echo "Challenge 06 did not pass via $l2url (exit $status); trying the next provider."
              fi
            done

            echo "Challenge 06 did not pass through any Robinhood archive provider." >&2
            exit 1
          fi

          endpoints=(
            "https://gateway.tenderly.co/public/mainnet"
            "https://eth-pokt.nodies.app"
            "https://eth1.lava.build"
            "https://eth.meowrpc.com"
            "https://eth.drpc.org"
            "https://rpc.flashbots.net"
            "https://eth.rpc.blxrbdn.com"
            "https://eth.merkle.io"
          )

          for url in "${endpoints[@]}"; do
            echo "::group::Challenge $challenge via $url"
            export ETH_RPC_URL="$url"
            if timeout 210 python3 alpha.py check "$challenge"; then
              echo "::endgroup::"
              echo "Challenge $challenge passed via $url"
              exit 0
            else
              status=$?
              echo "::endgroup::"
              echo "Challenge $challenge did not pass via $url (exit $status); trying the next provider."
            fi
          done

          echo "Challenge $challenge did not pass through any public provider." >&2
          exit 1
