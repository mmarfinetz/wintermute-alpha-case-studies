name: Verify analysis answers

on:
  push:
    branches:
      - main
    paths:
      - "alpha.py"
      - "challenges/**/answer.txt"
      - "challenges/**/challenge.json"
      - ".github/workflows/verify.yml"
  pull_request:
    paths:
      - "alpha.py"
      - "challenges/**/answer.txt"
      - "challenges/**/challenge.json"
      - ".github/workflows/verify.yml"
  workflow_dispatch:

concurrency:
  group: analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    name: Official analysis checker
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check every analysis challenge
        run: python3 alpha.py check 01 04 05 08
